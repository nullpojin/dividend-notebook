<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Dividend Notebook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F2EEE3;
    --card-bg: #FBF9F3;
    --ink: #24303D;
    --ink-soft: #64707C;
    --ink-faint: #A6A497;
    --accent-gold: #9C7A3C;
    --accent-gold-bg: #EFE4CC;
    --accent-green: #3F6B4E;
    --accent-red: #A1433B;
    --line: #D9D2C1;
    --radius-s: 6px;
    --radius-m: 10px;
    --serif: 'Shippori Mincho', serif;
    --sans: 'Zen Kaku Gothic New', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', Meiryo, sans-serif;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1B1F27;
      --card-bg: #242833;
      --ink: #ECE8DE;
      --ink-soft: #A6A497;
      --ink-faint: #6C7280;
      --accent-gold: #CBA75E;
      --accent-gold-bg: #3A331F;
      --accent-green: #7CB08D;
      --accent-red: #D6867B;
      --line: #3A3F4A;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1B1F27;
    --card-bg: #242833;
    --ink: #ECE8DE;
    --ink-soft: #A6A497;
    --ink-faint: #6C7280;
    --accent-gold: #CBA75E;
    --accent-gold-bg: #3A331F;
    --accent-green: #7CB08D;
    --accent-red: #D6867B;
    --line: #3A3F4A;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  .app {
    max-width: 480px;
    margin: 0 auto;
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    position: relative;
    background: var(--bg);
  }

  header.app-head {
    flex-shrink: 0;
    padding: calc(18px + env(safe-area-inset-top, 0px)) 20px 14px;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    border-bottom: 1px solid var(--line);
  }
  header.app-head h1 {
    font-family: var(--serif);
    font-weight: 700;
    font-size: 22px;
    margin: 0;
    letter-spacing: 0.02em;
  }
  header.app-head .meta {
    font-size: 11.5px;
    color: var(--ink-soft);
    font-variant-numeric: tabular-nums;
  }
  header.app-head .head-right {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .sync-btn {
    background: none;
    border: none;
    padding: 4px;
    cursor: pointer;
    color: var(--ink-soft);
    display: flex;
  }
  .sync-btn:disabled { opacity: 0.4; cursor: default; }
  .sync-btn.spinning svg { animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  #toastMount { padding: 0 20px; flex-shrink: 0; }
  .toast {
    margin-bottom: 16px;
    padding: 10px 13px;
    border-radius: var(--radius-s);
    font-size: 12.5px;
    background: var(--accent-gold-bg);
    color: var(--ink);
  }
  .toast.error { background: transparent; border: 1px solid var(--accent-red); color: var(--accent-red); }

  .content {
    flex: 1;
    overflow-y: auto;
    padding: 18px 20px 32px;
  }

  /* stat card */
  .stat-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1px;
    background: var(--line);
    border: 1px solid var(--line);
    border-radius: var(--radius-m);
    overflow: hidden;
  }
  .stat-cell {
    background: var(--card-bg);
    padding: 16px 15px;
  }
  .stat-label {
    font-size: 11.5px;
    color: var(--ink-soft);
    margin-bottom: 6px;
  }
  .stat-value {
    font-family: var(--serif);
    font-size: 21px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .stat-value.pos { color: var(--accent-green); }
  .stat-value.neg { color: var(--accent-red); }
  .stat-value.gold { color: var(--accent-gold); }
  .stat-sub {
    font-size: 11.5px;
    color: var(--ink-soft);
    margin-top: 3px;
    font-variant-numeric: tabular-nums;
  }
  .stat-sub.pos { color: var(--accent-green); }

  .hero-card {
    background: var(--card-bg);
    border: 1px solid var(--line);
    border-radius: var(--radius-m);
    padding: 18px 16px;
    margin-bottom: 10px;
  }
  .hero-card .stat-value { font-size: 26px; }
  .hero-caption {
    font-size: 11px;
    color: var(--ink-faint);
    margin-top: 5px;
  }

  section.block { margin-top: 26px; }
  .section-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 8px;
  }
  .section-head h2 {
    font-family: var(--serif);
    font-size: 16px;
    font-weight: 700;
    margin: 0;
  }
  .section-head .count {
    font-size: 11.5px;
    color: var(--ink-soft);
  }

  .list { border-top: 1px solid var(--line); }
  .empty {
    padding: 22px 2px;
    color: var(--ink-soft);
    font-size: 13px;
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
  }

  /* holding row */
  .row {
    padding: 13px 2px;
    border-bottom: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    gap: 7px;
    cursor: pointer;
  }
  .row:hover { background: rgba(0,0,0,0.02); }
  .row-top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 10px;
  }
  .row-name { font-weight: 700; font-size: 15px; }
  .row-code {
    color: var(--ink-soft);
    font-size: 11.5px;
    margin-left: 8px;
    font-variant-numeric: tabular-nums;
  }
  .fund-badge {
    display: inline-block;
    margin-left: 8px;
    padding: 1px 7px;
    font-size: 10px;
    font-weight: 700;
    color: var(--accent-gold);
    background: var(--accent-gold-bg);
    border-radius: 10px;
    vertical-align: middle;
  }
  .checkbox-field {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 12px;
  }
  .checkbox-field input[type="checkbox"] {
    width: auto;
  }
  .checkbox-field label {
    margin-bottom: 0;
    font-size: 13px;
    color: var(--ink);
  }
  .row-eval {
    display: flex;
    align-items: center;
    gap: 4px;
    flex-shrink: 0;
  }
  .row-eval .amt { font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .chev { color: var(--ink-faint); flex-shrink: 0; }
  .row-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 5px 14px;
    font-size: 12px;
    color: var(--ink-soft);
  }
  .row-grid .val { color: var(--ink); margin-top: 2px; font-variant-numeric: tabular-nums; }
  .row-grid .gain { font-weight: 700; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .row-grid .gain.pos { color: var(--accent-green); }
  .row-grid .gain.neg { color: var(--accent-red); }

  /* dividend row */
  .div-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 2px;
    border-bottom: 1px solid var(--line);
    cursor: pointer;
  }
  .div-row:hover { background: rgba(0,0,0,0.02); }
  .div-name { font-weight: 700; font-size: 14px; }
  .div-date { font-size: 11.5px; color: var(--ink-soft); margin-top: 2px; }
  .div-amount {
    font-family: var(--serif);
    font-weight: 700;
    color: var(--accent-gold);
    font-variant-numeric: tabular-nums;
  }
  .div-right { display: flex; align-items: center; gap: 4px; }

  /* chart */
  .chart-wrap {
    margin-top: 22px;
    border: 1px solid var(--line);
    border-radius: var(--radius-m);
    padding: 20px 14px 12px;
    background: var(--card-bg);
    overflow-x: auto;
  }
  svg text { font-family: var(--sans); }

  /* FAB */
  .fab {
    position: absolute;
    right: 20px;
    bottom: calc(92px + env(safe-area-inset-bottom, 0px));
    width: 54px;
    height: 54px;
    border-radius: 50%;
    background: var(--ink);
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 6px 16px rgba(0,0,0,0.28);
    cursor: pointer;
  }
  .fab svg { stroke: var(--bg); }

  /* tab bar */
  nav.tabbar {
    flex-shrink: 0;
    background: var(--card-bg);
    border-top: 1px solid var(--line);
    display: flex;
    padding: 10px 0 calc(14px + env(safe-area-inset-bottom, 0px));
  }
  .tab-item {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    background: none;
    border: none;
    cursor: pointer;
    font-family: var(--sans);
    color: var(--ink-soft);
  }
  .tab-item svg { stroke: var(--ink-soft); }
  .tab-item span { font-size: 10.5px; }
  .tab-item.active { color: var(--accent-gold); }
  .tab-item.active svg { stroke: var(--accent-gold); }
  .tab-item.active span { font-weight: 700; }

  /* bottom sheet */
  .sheet-overlay {
    position: absolute;
    inset: 0;
    z-index: 10;
  }
  .scrim {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.4);
  }
  .sheet {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    background: var(--card-bg);
    border-radius: 18px 18px 0 0;
    padding: 20px 20px calc(26px + env(safe-area-inset-bottom, 0px));
    box-shadow: 0 -10px 28px rgba(0,0,0,0.18);
    max-height: 85%;
    overflow-y: auto;
  }
  .sheet-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 18px;
  }
  .sheet-head h2 {
    font-family: var(--serif);
    font-size: 17px;
    font-weight: 700;
    margin: 0;
  }
  .sheet-close {
    background: none;
    border: none;
    padding: 4px;
    cursor: pointer;
  }
  .sheet-close svg { stroke: var(--ink-soft); }

  .field-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px 12px;
    margin-bottom: 12px;
  }
  .field-grid .full { grid-column: 1 / -1; }
  label {
    display: block;
    font-size: 11.5px;
    color: var(--ink-soft);
    margin-bottom: 5px;
  }
  input {
    width: 100%;
    padding: 10px 11px;
    font-family: var(--sans);
    font-size: 14px;
    color: var(--ink);
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: var(--radius-s);
    font-variant-numeric: tabular-nums;
  }
  input:focus {
    outline: 2px solid var(--accent-gold);
    outline-offset: 1px;
  }

  .sheet-actions {
    display: flex;
    gap: 10px;
    margin-top: 18px;
  }
  button.ghost {
    flex: 1;
    padding: 12px 14px;
    font-family: var(--sans);
    font-size: 14px;
    color: var(--ink-soft);
    background: none;
    border: 1px solid var(--line);
    border-radius: var(--radius-s);
    cursor: pointer;
  }
  button.primary {
    flex: 1;
    padding: 12px 14px;
    font-family: var(--sans);
    font-weight: 700;
    font-size: 14px;
    color: var(--bg);
    background: var(--ink);
    border: none;
    border-radius: var(--radius-s);
    cursor: pointer;
  }
  button.primary:disabled { opacity: 0.5; cursor: default; }
  .delete-link {
    display: block;
    margin-top: 14px;
    text-align: center;
    background: none;
    border: none;
    color: var(--accent-red);
    font-family: var(--sans);
    font-size: 13px;
    text-decoration: underline;
    text-underline-offset: 3px;
    cursor: pointer;
  }
  .form-error {
    color: var(--accent-red);
    font-size: 12.5px;
    margin-top: 10px;
  }

  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="app">

  <header class="app-head">
    <h1 id="headTitle">Holdings</h1>
    <div class="head-right">
      <span class="meta" id="headMeta"></span>
      <button class="sync-btn" id="syncBtn" aria-label="Sync with J-Quants" title="Sync current prices and dividends">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 4v5h-5"/></svg>
      </button>
    </div>
  </header>

  <div id="toastMount"></div>
  <div class="content" id="content"></div>

  <button class="fab" id="fab" aria-label="Add">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
  </button>

  <nav class="tabbar">
    <button class="tab-item active" id="tabHoldings" data-tab="holdings">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><line x1="7.5" y1="9" x2="16.5" y2="9"/><line x1="7.5" y1="13" x2="16.5" y2="13"/><line x1="7.5" y1="17" x2="13" y2="17"/></svg>
      <span>Holdings</span>
    </button>
    <button class="tab-item" id="tabDividends" data-tab="dividends">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="7.5" rx="8" ry="3"/><ellipse cx="12" cy="12" rx="8" ry="3"/><ellipse cx="12" cy="16.5" rx="8" ry="3"/></svg>
      <span>Dividends</span>
    </button>
  </nav>

  <div class="sheet-overlay" id="sheetOverlay" hidden>
    <div class="scrim" id="scrim"></div>
    <div class="sheet" id="sheetBody"></div>
  </div>

</div>

<script>
(function () {
  "use strict";

  let holdings = [];
  let dividends = [];
  let activeTab = "holdings";
  let editingType = null;   // "holding" | "dividend"
  let editingId = null;

  const chevronSvg = '<svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>';

  async function api(path, options) {
    const res = await fetch(path, options);
    if (!res.ok) {
      const body = await res.json().catch(() => ({}));
      throw new Error(body.detail || `${res.status} ${res.statusText}`);
    }
    if (res.status === 204) return null;
    return res.json();
  }

  async function loadAll() {
    [holdings, dividends] = await Promise.all([
      api("/api/holdings"),
      api("/api/dividends"),
    ]);
  }

  const yen = new Intl.NumberFormat("en-US", { style: "currency", currency: "JPY", maximumFractionDigits: 0 });
  const num = new Intl.NumberFormat("en-US", { maximumFractionDigits: 2 });
  const dateFmt = new Intl.DateTimeFormat("en-US", { month: "short", day: "numeric", year: "numeric" });

  function fmtYen(n) { return yen.format(Math.round(n)); }
  function fmtSigned(n) {
    const sign = n > 0 ? "+" : n < 0 ? "−" : "";
    return sign + "¥" + num.format(Math.round(Math.abs(n)));
  }
  function fmtDate(s) {
    const d = new Date(s + "T00:00:00");
    if (isNaN(d)) return s;
    return dateFmt.format(d);
  }
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  // ---------- Predicted annual dividend ----------
  function latestDividendByName() {
    const latest = {};
    dividends.forEach(d => {
      const cur = latest[d.name];
      if (!cur || new Date(d.date) > new Date(cur.date)) latest[d.name] = d;
    });
    return latest;
  }
  function predictedAnnualDividend() {
    const latest = latestDividendByName();
    let total = 0;
    let covered = 0;
    holdings.forEach(h => {
      const rec = latest[h.name];
      if (rec) { total += rec.amount; covered += 1; }
    });
    return { total, covered, ofTotal: holdings.length };
  }

  // ---------- Header ----------
  function renderHeader() {
    const title = document.getElementById("headTitle");
    const meta = document.getElementById("headMeta");
    if (activeTab === "holdings") {
      title.textContent = "Holdings";
      meta.textContent = "As of " + dateFmt.format(new Date());
    } else {
      title.textContent = "Dividends";
      meta.textContent = String(new Date().getFullYear());
    }
  }

  // ---------- Holdings tab ----------
  function unitDivisor(h) { return h.isFund ? 10000 : 1; }

  function renderHoldingsTab() {
    const totalEval = holdings.reduce((s, h) => s + (h.shares * h.currentPrice) / unitDivisor(h), 0);
    const totalCost = holdings.reduce((s, h) => s + (h.shares * h.costPrice) / unitDivisor(h), 0);
    const gain = totalEval - totalCost;
    const gainPct = totalCost > 0 ? (gain / totalCost) * 100 : 0;
    const gainCls = gain > 0 ? "pos" : gain < 0 ? "neg" : "";

    let html = `
      <div class="stat-row">
        <div class="stat-cell">
          <div class="stat-label">Total Value</div>
          <div class="stat-value">${fmtYen(totalEval)}</div>
        </div>
        <div class="stat-cell">
          <div class="stat-label">Unrealized P&amp;L</div>
          <div class="stat-value ${gainCls}">${fmtSigned(gain)}</div>
          <div class="stat-sub ${gainCls}">${gain >= 0 ? "+" : ""}${gainPct.toFixed(1)}%</div>
        </div>
      </div>

      <section class="block">
        <div class="section-head">
          <h2>Positions</h2>
          <span class="count">${holdings.length} holding${holdings.length === 1 ? "" : "s"}</span>
        </div>
    `;

    if (holdings.length === 0) {
      html += `<div class="empty">No holdings yet. Tap + to add one.</div>`;
    } else {
      html += `<div class="list">` + holdings.map(h => {
        const divisor = unitDivisor(h);
        const evalAmt = (h.shares * h.currentPrice) / divisor;
        const costAmt = (h.shares * h.costPrice) / divisor;
        const hGain = evalAmt - costAmt;
        const hGainCls = hGain > 0 ? "pos" : hGain < 0 ? "neg" : "";
        const unitsLabel = h.isFund ? "Units" : "Shares";
        const costLabel = h.isFund ? "Cost NAV /10,000u" : "Cost Basis";
        const currentLabel = h.isFund ? "Current NAV /10,000u" : "Current Price";
        return `
          <div class="row" data-action="edit-holding" data-id="${h.id}">
            <div class="row-top">
              <div>
                <span class="row-name">${escapeHtml(h.name)}</span>
                ${h.code ? `<span class="row-code">${escapeHtml(h.code)}</span>` : ""}
                ${h.isFund ? `<span class="fund-badge">Fund</span>` : ""}
              </div>
              <div class="row-eval">
                <span class="amt">${fmtYen(evalAmt)}</span>
                ${chevronSvg}
              </div>
            </div>
            <div class="row-grid">
              <div>${unitsLabel}<div class="val">${num.format(h.shares)}</div></div>
              <div>${costLabel}<div class="val">${fmtYen(h.costPrice)}</div></div>
              <div>${currentLabel}<div class="val">${fmtYen(h.currentPrice)}</div></div>
              <div>Gain/Loss<div class="gain ${hGainCls}">${fmtSigned(hGain)}</div></div>
            </div>
          </div>
        `;
      }).join("") + `</div>`;
    }

    html += `</section>`;
    document.getElementById("content").innerHTML = html;
  }

  // ---------- Dividends tab ----------
  function shadeGold(t) {
    // interpolate between accent-gold-bg (t=0) and accent-gold (t=1)
    const from = [0xEF, 0xE4, 0xCC];
    const to = [0x9C, 0x7A, 0x3C];
    const c = from.map((v, i) => Math.round(v + (to[i] - v) * t));
    return `rgb(${c[0]},${c[1]},${c[2]})`;
  }

  function renderChart() {
    if (dividends.length === 0) {
      return `<div class="empty" style="border:none;padding:8px 2px;">Record a dividend to see the yearly chart.</div>`;
    }
    const byYear = {};
    dividends.forEach(d => {
      const y = new Date(d.date).getFullYear();
      if (!isNaN(y)) byYear[y] = (byYear[y] || 0) + d.amount;
    });
    const years = Object.keys(byYear).map(Number).sort((a, b) => a - b);
    const max = Math.max(...years.map(y => byYear[y]), 1);

    const barW = 48;
    const gap = 24;
    const chartH = 120;
    const topPad = 28;
    const width = years.length * (barW + gap) + gap;
    const height = chartH + topPad + 40;

    let bars = "";
    years.forEach((y, i) => {
      const val = byYear[y];
      const h = Math.max((val / max) * chartH, 2);
      const x = gap + i * (barW + gap);
      const yTop = topPad + (chartH - h);
      const t = years.length > 1 ? i / (years.length - 1) : 1;
      bars += `
        <text x="${x + barW / 2}" y="${yTop - 8}" text-anchor="middle" font-size="11" fill="var(--ink)" font-weight="700" font-variant-numeric="tabular-nums">${num.format(Math.round(val))}</text>
        <rect x="${x}" y="${yTop}" width="${barW}" height="${h}" fill="${shadeGold(t)}" rx="3"></rect>
        <text x="${x + barW / 2}" y="${topPad + chartH + 20}" text-anchor="middle" font-size="11.5" fill="var(--ink-soft)">${y}</text>
      `;
    });

    return `<svg viewBox="0 0 ${width} ${height}" width="${width}" height="${height}" style="display:block;min-width:${width}px;">${bars}</svg>`;
  }

  function renderDividendsTab() {
    const thisYear = new Date().getFullYear();
    const receivedThisYear = dividends
      .filter(d => new Date(d.date).getFullYear() === thisYear)
      .reduce((s, d) => s + d.amount, 0);
    const paymentsThisYear = dividends.filter(d => new Date(d.date).getFullYear() === thisYear).length;
    const predicted = predictedAnnualDividend();

    let caption = "Estimated from each holding's most recent dividend payment.";
    if (holdings.length > 0 && predicted.covered < predicted.ofTotal) {
      const missing = predicted.ofTotal - predicted.covered;
      caption = `Based on ${predicted.covered} of ${predicted.ofTotal} holdings — ${missing} holding${missing === 1 ? "" : "s"} ${missing === 1 ? "has" : "have"} no dividend history yet.`;
    }

    let html = `
      <div class="hero-card">
        <div class="stat-label">Projected Annual Dividend</div>
        <div class="stat-value gold">${fmtYen(predicted.total)}</div>
        <div class="hero-caption">${caption}</div>
      </div>

      <div class="stat-row">
        <div class="stat-cell">
          <div class="stat-label">Received This Year</div>
          <div class="stat-value">${fmtYen(receivedThisYear)}</div>
        </div>
        <div class="stat-cell">
          <div class="stat-label">Payments</div>
          <div class="stat-value">${paymentsThisYear}</div>
        </div>
      </div>

      <div class="chart-wrap">${renderChart()}</div>

      <section class="block">
        <div class="section-head">
          <h2>Payment History</h2>
          <span class="count">${dividends.length}</span>
        </div>
    `;

    if (dividends.length === 0) {
      html += `<div class="empty">No dividends recorded yet. Tap + to add one.</div>`;
    } else {
      const sorted = [...dividends].sort((a, b) => new Date(b.date) - new Date(a.date));
      html += `<div class="list">` + sorted.map(d => `
        <div class="div-row" data-action="edit-dividend" data-id="${d.id}">
          <div>
            <div class="div-name">${escapeHtml(d.name)}</div>
            <div class="div-date">${fmtDate(d.date)}</div>
          </div>
          <div class="div-right">
            <span class="div-amount">${fmtYen(d.amount)}</span>
            ${chevronSvg}
          </div>
        </div>
      `).join("") + `</div>`;
    }

    html += `</section>`;
    document.getElementById("content").innerHTML = html;
  }

  function renderTab() {
    renderHeader();
    if (activeTab === "holdings") renderHoldingsTab();
    else renderDividendsTab();
    document.getElementById("tabHoldings").classList.toggle("active", activeTab === "holdings");
    document.getElementById("tabDividends").classList.toggle("active", activeTab === "dividends");
    document.getElementById("fab").setAttribute("aria-label", activeTab === "holdings" ? "Add holding" : "Record dividend");
  }

  document.querySelectorAll(".tab-item").forEach(btn => {
    btn.addEventListener("click", () => {
      activeTab = btn.dataset.tab;
      renderTab();
    });
  });

  // ---------- J-Quants sync ----------
  function showToast(message, isError) {
    const mount = document.getElementById("toastMount");
    mount.innerHTML = `<div class="toast${isError ? " error" : ""}">${escapeHtml(message)}</div>`;
    if (!isError) {
      setTimeout(() => { if (mount.firstChild) mount.innerHTML = ""; }, 6000);
    }
  }

  document.getElementById("syncBtn").addEventListener("click", async () => {
    const btn = document.getElementById("syncBtn");
    btn.disabled = true;
    btn.classList.add("spinning");
    document.getElementById("toastMount").innerHTML = "";
    try {
      const result = await api("/api/sync", { method: "POST" });
      await loadAll();
      renderTab();
      const parts = [];
      parts.push(`${result.holdingsUpdated.length} price${result.holdingsUpdated.length === 1 ? "" : "s"} updated`);
      parts.push(`${result.dividendsAdded.length} dividend${result.dividendsAdded.length === 1 ? "" : "s"} added`);
      let msg = "Synced: " + parts.join(", ");
      if (result.warnings.length) msg += ` (${result.warnings.length} warning${result.warnings.length === 1 ? "" : "s"} — see console)`;
      if (result.skipped && result.skipped.length) console.log("Sync skipped (no ticker code):", result.skipped);
      if (result.warnings.length) console.warn("Sync warnings:", result.warnings);
      if (result.errors.length) console.error("Sync errors:", result.errors);
      showToast(msg, result.errors.length > 0);
    } catch (err) {
      showToast("Sync failed: " + err.message, true);
    } finally {
      btn.disabled = false;
      btn.classList.remove("spinning");
    }
  });

  document.getElementById("content").addEventListener("click", (e) => {
    const row = e.target.closest("[data-action]");
    if (!row) return;
    const id = row.dataset.id;
    if (row.dataset.action === "edit-holding") {
      const h = holdings.find(x => x.id === id);
      if (h) openSheet("holding", h);
    } else if (row.dataset.action === "edit-dividend") {
      const d = dividends.find(x => x.id === id);
      if (d) openSheet("dividend", d);
    }
  });

  document.getElementById("fab").addEventListener("click", () => {
    openSheet(activeTab === "holdings" ? "holding" : "dividend", null);
  });

  // ---------- Bottom sheet ----------
  const overlay = document.getElementById("sheetOverlay");
  const sheetBody = document.getElementById("sheetBody");

  function holdingSheetHtml(h) {
    h = h || { code: "", name: "", shares: "", costPrice: "", currentPrice: "", isFund: false };
    return `
      <div class="sheet-head">
        <h2>${editingId ? "Edit Holding" : "Add Holding"}</h2>
        <button class="sheet-close" id="sheetCloseBtn" type="button">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>
        </button>
      </div>
      <form id="sheetForm">
        <div class="field-grid">
          <div class="full">
            <label for="hf-name">Name</label>
            <input id="hf-name" required value="${escapeHtml(h.name)}" placeholder="e.g. Toyota Motor">
          </div>
        </div>
        <div class="checkbox-field">
          <input type="checkbox" id="hf-isfund" ${h.isFund ? "checked" : ""}>
          <label for="hf-isfund">Investment trust (NAV quoted per 10,000 units)</label>
        </div>
        <div class="field-grid">
          <div>
            <label for="hf-code">Ticker Code</label>
            <input id="hf-code" value="${escapeHtml(h.code)}" placeholder="e.g. 7203">
          </div>
          <div>
            <label for="hf-shares" id="hf-shares-label">Shares</label>
            <input id="hf-shares" type="number" min="0" step="1" required value="${h.shares}">
          </div>
        </div>
        <div class="field-grid">
          <div>
            <label for="hf-cost" id="hf-cost-label">Cost Basis (¥)</label>
            <input id="hf-cost" type="number" min="0" step="0.1" required value="${h.costPrice}">
          </div>
          <div>
            <label for="hf-current" id="hf-current-label">Current Price (¥)</label>
            <input id="hf-current" type="number" min="0" step="0.1" required value="${h.currentPrice}">
          </div>
        </div>
        <div class="sheet-actions">
          <button type="button" class="ghost" id="sheetCancelBtn">Cancel</button>
          <button type="submit" class="primary">${editingId ? "Save" : "Add"}</button>
        </div>
        ${editingId ? `<button type="button" class="delete-link" id="sheetDeleteBtn">Delete holding</button>` : ""}
        <div class="form-error" id="sheetError" hidden></div>
      </form>
    `;
  }

  function updateHoldingFormLabels() {
    const isFund = document.getElementById("hf-isfund").checked;
    document.getElementById("hf-shares-label").textContent = isFund ? "Units" : "Shares";
    document.getElementById("hf-cost-label").textContent = isFund ? "Cost NAV (¥/10,000 units)" : "Cost Basis (¥)";
    document.getElementById("hf-current-label").textContent = isFund ? "Current NAV (¥/10,000 units)" : "Current Price (¥)";
  }

  function dividendSheetHtml(d) {
    d = d || { name: "", amount: "", date: new Date().toISOString().slice(0, 10) };
    const holdingNames = holdings.map(h => `<option value="${escapeHtml(h.name)}">`).join("");
    return `
      <div class="sheet-head">
        <h2>${editingId ? "Edit Dividend" : "Record Dividend"}</h2>
        <button class="sheet-close" id="sheetCloseBtn" type="button">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>
        </button>
      </div>
      <form id="sheetForm">
        <div class="field-grid">
          <div class="full">
            <label for="df-name">Name</label>
            <input id="df-name" list="holdingNames" required value="${escapeHtml(d.name)}" placeholder="e.g. Toyota Motor">
            <datalist id="holdingNames">${holdingNames}</datalist>
          </div>
        </div>
        <div class="field-grid">
          <div>
            <label for="df-amount">Amount (¥, after tax)</label>
            <input id="df-amount" type="number" min="0" step="1" required value="${d.amount}">
          </div>
          <div>
            <label for="df-date">Date</label>
            <input id="df-date" type="date" required value="${d.date}">
          </div>
        </div>
        <div class="sheet-actions">
          <button type="button" class="ghost" id="sheetCancelBtn">Cancel</button>
          <button type="submit" class="primary">${editingId ? "Save" : "Record"}</button>
        </div>
        ${editingId ? `<button type="button" class="delete-link" id="sheetDeleteBtn">Delete record</button>` : ""}
        <div class="form-error" id="sheetError" hidden></div>
      </form>
    `;
  }

  function openSheet(type, existing) {
    editingType = type;
    editingId = existing ? existing.id : null;
    sheetBody.innerHTML = type === "holding" ? holdingSheetHtml(existing) : dividendSheetHtml(existing);
    overlay.hidden = false;
    document.getElementById("sheetForm").addEventListener("submit", onSheetSubmit);
    document.getElementById("sheetCancelBtn").addEventListener("click", closeSheet);
    document.getElementById("sheetCloseBtn").addEventListener("click", closeSheet);
    const deleteBtn = document.getElementById("sheetDeleteBtn");
    if (deleteBtn) deleteBtn.addEventListener("click", onSheetDelete);
    if (type === "holding") {
      document.getElementById("hf-isfund").addEventListener("change", updateHoldingFormLabels);
      updateHoldingFormLabels();
    }
    const firstInput = sheetBody.querySelector("input");
    if (firstInput) firstInput.focus();
  }
  function closeSheet() {
    overlay.hidden = true;
    sheetBody.innerHTML = "";
    editingType = null;
    editingId = null;
  }
  document.getElementById("scrim").addEventListener("click", closeSheet);

  async function onSheetSubmit(e) {
    e.preventDefault();
    const submitBtn = e.target.querySelector("button[type=submit]");
    const errorBox = document.getElementById("sheetError");
    submitBtn.disabled = true;
    try {
      if (editingType === "holding") {
        const data = {
          name: document.getElementById("hf-name").value.trim(),
          code: document.getElementById("hf-code").value.trim(),
          shares: parseFloat(document.getElementById("hf-shares").value) || 0,
          costPrice: parseFloat(document.getElementById("hf-cost").value) || 0,
          currentPrice: parseFloat(document.getElementById("hf-current").value) || 0,
          isFund: document.getElementById("hf-isfund").checked,
        };
        if (!data.name) { submitBtn.disabled = false; return; }
        if (editingId) {
          await api(`/api/holdings/${editingId}`, { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(data) });
        } else {
          await api("/api/holdings", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(data) });
        }
      } else {
        const data = {
          name: document.getElementById("df-name").value.trim(),
          amount: parseFloat(document.getElementById("df-amount").value) || 0,
          date: document.getElementById("df-date").value,
        };
        if (!data.name || !data.date) { submitBtn.disabled = false; return; }
        if (editingId) {
          await api(`/api/dividends/${editingId}`, { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(data) });
        } else {
          await api("/api/dividends", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(data) });
        }
      }
      closeSheet();
      await loadAll();
      renderTab();
    } catch (err) {
      errorBox.textContent = "Save failed: " + err.message;
      errorBox.hidden = false;
      submitBtn.disabled = false;
    }
  }

  async function onSheetDelete() {
    const label = editingType === "holding" ? "this holding" : "this dividend record";
    if (!confirm(`Delete ${label}?`)) return;
    const path = editingType === "holding" ? `/api/holdings/${editingId}` : `/api/dividends/${editingId}`;
    try {
      await api(path, { method: "DELETE" });
      closeSheet();
      await loadAll();
      renderTab();
    } catch (err) {
      const errorBox = document.getElementById("sheetError");
      errorBox.textContent = "Delete failed: " + err.message;
      errorBox.hidden = false;
    }
  }

  loadAll()
    .then(renderTab)
    .catch(err => {
      document.getElementById("content").innerHTML =
        `<p style="color:#A1433B">Failed to load data: ${escapeHtml(err.message)}</p>`;
    });
})();
</script>
</body>
</html>
